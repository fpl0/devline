<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My tasks</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<main>
    <header>
        <div>
            <h1>My tasks</h1>
            <p>Signed in as <strong th:text="${username}">demo</strong></p>
        </div>
        <form method="post" th:action="@{/logout}">
            <button type="submit" class="secondary">Sign out</button>
        </form>
    </header>
    <p role="alert" class="error" th:if="${error}" th:text="${error}"></p>
    <form class="add-task" method="post" th:action="@{/tasks}">
        <label for="title">New task</label>
        <div>
            <input type="text" name="title" id="title" maxlength="120" required>
            <button type="submit">Add task</button>
        </div>
    </form>
    <p th:if="${tasks.isEmpty()}">No tasks yet.</p>
    <ul class="tasks" th:unless="${tasks.isEmpty()}">
        <li th:each="task : ${tasks}" th:attr="data-task-id=${task.id}">
            <div>
                <strong th:text="${task.title}"></strong>
                <small th:text="${task.recorded ? 'Recorded' : task.completed ? 'Queued' : 'Open'}"></small>
            </div>
            <div class="actions">
                <form th:unless="${task.completed}" method="post" th:action="@{/tasks/{id}/complete(id=${task.id})}">
                    <button class="secondary" type="submit">Complete</button>
                </form>
                <form method="post" th:action="@{/tasks/{id}/delete(id=${task.id})}">
                    <button class="secondary" type="submit">Delete</button>
                </form>
            </div>
        </li>
    </ul>
    <footer>
        <span>Loaded from <strong th:text="${source == 'redis' ? 'Redis' : 'PostgreSQL'}"></strong></span>
        <a th:href="@{/tasks}">Refresh</a>
    </footer>
</main>
</body>
</html>
