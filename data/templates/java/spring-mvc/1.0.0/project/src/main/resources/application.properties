spring.application.name=__PROJECT_NAME__
server.address=127.0.0.1
server.port=8081
server.servlet.session.cookie.name=JAVA_TASKBOARD_SESSION
server.servlet.session.cookie.same-site=lax

spring.datasource.url=jdbc:postgresql://127.0.0.1:${DEVLINE_POSTGRES_DATABASE_PORT}/devline
spring.datasource.username=devline
spring.datasource.password=${DEVLINE_POSTGRES_PASSWORD}
spring.sql.init.mode=always

spring.data.redis.host=127.0.0.1
spring.data.redis.port=${DEVLINE_REDIS_REDIS_PORT}
spring.data.redis.password=${DEVLINE_REDIS_PASSWORD}
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s

spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=${DEVLINE_RABBITMQ_AMQP_PORT}
spring.rabbitmq.username=devline
spring.rabbitmq.password=${DEVLINE_RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=devline
spring.rabbitmq.connection-timeout=2s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

spring.security.oauth2.client.provider.keycloak.issuer-uri=${DEVLINE_KEYCLOAK_URL}/realms/devline-java
spring.security.oauth2.client.registration.keycloak.client-id=task-board-java
spring.security.oauth2.client.registration.keycloak.client-secret=${TASK_BOARD_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri=${TASK_BOARD_BASE_URL}/login/oauth2/code/keycloak
spring.security.oauth2.client.registration.keycloak.scope=openid,profile
