[package]
name = "tauri-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", default-features = false, features = ["wry", "custom-protocol"] }

serde_json = "1.0"

[dev-dependencies]
tauri = { version = "2.12.5", default-features = false, features = ["test"] }
