<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fieldnotes</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="inspector.js" defer></script>
  </head>
  <body>
    <aside>
      <header>
        <span class="eyebrow">YOUR LOCAL NOTEBOOK</span>
        <h1>Fieldnotes</h1>
        <button id="new" class="primary">＋ New note</button>
      </header>
      <label class="search-label" for="search">Search notes and tags</label
      ><input id="search" type="search" placeholder="Search your notebook" />
      <nav id="notes" aria-label="Notes"></nav>
      <footer>
        <button id="export">Export</button><button id="import">Import</button
        ><span id="count"></span>
      </footer>
    </aside>
    <main>
      <div id="empty">
        <span class="eyebrow">ROOM TO THINK</span>
        <h2>Keep a thought.<br />Find it later.</h2>
        <p>Select a note or create one. Your writing stays on this Mac.</p>
      </div>
      <form id="editor" hidden>
        <div class="toolbar">
          <span id="modified"></span
          ><button type="button" id="delete" class="quiet">Delete note</button>
        </div>
        <label for="title">Title</label
        ><input
          id="title"
          maxlength="160"
          required
          placeholder="An idea worth keeping"
        /><label for="tags">Tags <small>comma separated</small></label
        ><input id="tags" placeholder="work, reading, ideas" /><label for="body"
          >Note</label
        ><textarea id="body" placeholder="Start writing…"></textarea>
        <div class="editor-footer">
          <span id="statistics"></span
          ><button id="save" class="primary">Save note ⌘S</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <dialog id="transfer">
      <form method="dialog">
        <button class="close" aria-label="Close">×</button>
      </form>
      <h2 id="transfer-title"></h2>
      <p id="transfer-help"></p>
      <label for="json">Notebook JSON</label
      ><textarea id="json" spellcheck="false"></textarea
      ><button id="confirm-import" class="primary">Import notes</button>
      <p id="transfer-error" role="alert"></p>
    </dialog>
  </body>
</html>
