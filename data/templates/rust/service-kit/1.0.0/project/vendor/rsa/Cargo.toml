[package]
edition = "2024"
rust-version = "1.87"
name = "rsa"
version = "0.10.0-rc.22"
authors = [
    "RustCrypto Developers",
    "dignifiedquire <dignifiedquire@gmail.com>",
]
build = false
exclude = [
    "checkct/",
    "marvin-toolkit/",
    "thirdparty/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Pure Rust RSA implementation"
documentation = "https://docs.rs/rsa"
readme = "README.md"
keywords = [
    "rsa",
    "encryption",
    "security",
    "crypto",
]
categories = ["cryptography"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RustCrypto/RSA"

[package.metadata.docs.rs]
all-features = true

[features]
default = [
    "std",
    "encoding",
    "getrandom",
]
encoding = [
    "dep:pkcs1",
    "dep:pkcs8",
    "dep:spki",
]
getrandom = [
    "crypto-bigint/getrandom",
    "crypto-common/getrandom",
]
hazmat = []
pkcs1v15 = []
pkcs5 = ["pkcs8/encryption"]
serde = [
    "encoding",
    "dep:serde",
    "dep:serdect",
    "crypto-bigint/serde",
]
std = [
    "pkcs1?/std",
    "pkcs8?/std",
]

[lib]
name = "rsa"
path = "src/lib.rs"

[[test]]
