[package]
name="devline-client-pack"
version="0.1.0"
edition="2024"
[dependencies]
"sqlx"={version="=0.9.0",default-features=false,features=["mysql", "mysql-rsa", "postgres", "runtime-tokio", "tls-rustls-ring-webpki"]}
"amqprs"={version="=2.1.5",features=["urispec"]}
"redis"={version="=1.8.1",default-features=false,features=["tokio-rustls-comp", "tls-rustls-webpki-roots"]}
"mongodb"={version="=3.10.0"}
"async-nats"={version="=0.52.0",default-features=false,features=["ring", "jetstream"]}
"lettre"={version="=0.11.23",default-features=false,features=["builder", "smtp-transport", "tokio1-rustls-tls"]}
"meilisearch-sdk"={version="=0.33.0"}
"object_store"={version="=0.14.2",default-features=false,features=["aws-base", "reqwest", "ring"]}
"reqwest"={version="=0.13.5",default-features=false,features=["json", "rustls-no-provider"]}
"rustls"={version="=0.23.46",default-features=false,features=["ring", "std"]}
"openidconnect"={version="=4.1.0",default-features=false,features=["reqwest", "rustls-tls"]}
