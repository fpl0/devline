<main><header><h1>port</h1></header>
<div><span><span>Requires Restart</span></span></div>
<p>Port to accept WebSocket client connections on. There is no default:
the listener is only started once a port is set, here or via <code>listen</code>.</p>
<p>TLS is required unless <code>no_tls</code> is <code>true</code>.</p>
