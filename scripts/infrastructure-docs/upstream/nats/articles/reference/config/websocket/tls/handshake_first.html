<main><header><h1>handshake_first</h1></header>
<div>Aliases:<!-- --> <code>first</code>, <code>immediate</code></div>
<div><span><span>Hot Reloadable</span></span></div>
<p>Send the TLS handshake before the <code>INFO</code> protocol message rather
than after. A duration string instead of <code>true</code> waits that long for
a client that may not support it before falling back.</p>
