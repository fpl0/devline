<div>Aliases:<!-- --> <code>websocket_no_masking</code></div>
<div><span><span>Requires Restart</span></span></div>
<p>If true and connecting with the WebSocket protocol,

wishes <em>not</em> to mask outbound WebSocket frames.</p>
