<main><header><h1>no_randomize</h1></header>
<div>Aliases:<!-- --> <code>dont_randomize</code></div>
<div><span><span>Requires Restart</span></span></div>
<p>If true and more than one URL is specified, the first one
in the list will be used. If the client disconnects from the
server, then the next URL will be used in order.</p>
