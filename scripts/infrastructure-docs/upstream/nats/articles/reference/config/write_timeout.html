<main><header><h1>write_timeout</h1></header>
<div>Available since NATS Server <code>2.12</code></div>
<div><span><span>Requires Restart</span></span></div>
<p>What the server does when a connection misses its
<code>write_deadline</code>: <code>close</code> drops it, <code>retry</code> keeps trying,
<code>default</code> uses the built-in behaviour.</p>
<h2 id="types">Types</h2>
<table><thead><tr><th>Type</th><th>Description</th><th>Choices</th></tr></thead><tbody><tr><td><code>string</code></td><td>-</td><td><code>default</code>, <code>close</code>, <code>retry</code></td></tr></tbody></table></main>
