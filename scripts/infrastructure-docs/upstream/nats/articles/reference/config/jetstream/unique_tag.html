<main><header><h1>unique_tag</h1></header>
<div><span><span>Requires Restart</span></span></div>
<p>Defines a tag prefix as a constraint for placement of assets across
a JetStream domain. For example, if the value is <code>az:</code> then replicas
of an assets will be required to be placed on servers having
different <code>az:</code> tags.</p>
