<main><header><h1>expires</h1></header>
<div><span><span>Ignored Until Restart</span></span></div>
<p>The amount of time the permission is valid. Values such
as 1s, 1m, 1h (1 second, minute, hour) etc can be specified.
Default doesn't have a time limit.</p>
<h2 id="types">Types</h2>
<table><thead><tr><th>Type</th><th>Description</th><th>Choices</th></tr></thead><tbody><tr><td><code>duration</code></td><td>Duration as a string with units such as 100ms, 10s, 5m, or 2h.</td><td>-</td></tr></tbody></table></main>
