<main><header><h1>disable_sublist_cache</h1></header>
<div>Aliases:<!-- --> <code>no_sublist_cache</code></div>
<div><span><span>Requires Restart</span></span></div>
<p>If true, disable subscription caches for all accounts. This saves
resources in situations where different subjects are used
all the time.</p>
