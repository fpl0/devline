<main><header><h1>cluster</h1></header>
<div><span><span>Hot Reloadable</span></span></div>
<p>If specified, the destination is cluster-scoped. Messages received
by servers within the named cluster will only consider mappings with
the same cluster name. Otherwise, it will fallback to non-cluster scoped
mappings.</p>
