<main><header><h1>allow_insecure_cipher_suites</h1></header>
<div>Available since NATS Server <code>2.12</code></div>
<div><span><span>Hot Reloadable</span></span></div>
<p>Permit cipher suites Go considers insecure to be named in
<code>cipher_suites</code>. Without it those names are rejected.</p>
