<main><header><h1>limit</h1></header>
<div><span><span>Hot Reloadable</span></span><div>Handled only as part of the whole <code>resolver</code> block; replacement resolver is never Start()ed.</div></div>
<p>If set, limit the number of stored JWTs. In <code>full</code> mode, new JWTs
will be rejected where as in <code>cache</code> mode, old JWTs will be evicted
for new JWTs.</p>
