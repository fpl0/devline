		<h1>Healthcheck endpoints</h1>
		<p>Mailpit has two healthcheck HTTP endpoints that can be used for Docker or <a href="https://kubernetes.io/docs/reference/using-api/health-checks/">Kubernetes</a>: <code>/livez</code> and <code>/readyz</code>. Both endpoints should return a “200” response if Mailpit is running correctly.</p>
