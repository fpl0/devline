[package]
name = "devline"
version = "0.7.0"
edition = "2021"

[lib]
name = "devline_core"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "devline"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
sha2 = "0.10"
fs2 = "0.4"
libc = "0.2"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
fluent-uri = "0.4.1"
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.11"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
roxmltree = "0.21"

[profile.release]
lto = "thin"
strip = "debuginfo"
